name: JX Copper Realtime Alert Monitor

on:
  schedule:
    # 平日(月～金) JST 09:40, 09:50, 10:00 (建値改定の多い時間帯)
    - cron: '40 0 * * 1-5'
    - cron: '50 0 * * 1-5'
    - cron: '0 1 * * 1-5'
  workflow_dispatch:

jobs:
  check-jx-copper:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests pypdf
          playwright install --with-deps chromium

      - name: Run JX Copper Monitor Script
        env:
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
        run: |
          python jx_copper_monitor.py
